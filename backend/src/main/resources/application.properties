spring.application.name=estudio-bdd
server.port=8080

# Banco de dados (valores de desenvolvimento local; podem ser sobrescritos por variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estudiobdd}
spring.datasource.username=${DB_USER:estudiobdd}
spring.datasource.password=${DB_PASSWORD:estudiobdd}

# JPA: o esquema é criado/atualizado automaticamente. Os dados persistem entre reinícios.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CORS: somente a origem da SPA
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Erros padrão do Spring MVC também no formato ProblemDetail
spring.mvc.problemdetails.enabled=true
